version: '3.8'

services:
  aspectra:
    build: .
    image: aspectra-absa:latest
    container_name: aspectra_app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
